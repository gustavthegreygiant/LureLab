<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Lure Lab</title>
<meta name="theme-color" content="#10161c"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg">
<style>
:root{--bg:#10161c;--p:#18212a;--l:#2a3745;--t:#e6edf3;--m:#8b9bab;--a:#f5a524;--g:#3fb68b;--r:#ef6461}
@media(prefers-color-scheme:light){:root{--bg:#eef1f4;--p:#fff;--l:#cfd7df;--t:#16202a;--m:#5b6b7a;--a:#b86e00;--g:#17805b;--r:#c0392b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.45 system-ui,sans-serif;padding:env(safe-area-inset-top) 0 40px}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--l)}
h1{font:700 18px ui-monospace,monospace;letter-spacing:.08em;margin:0;color:var(--a);flex:1}h2{font:600 14px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--m);margin:0 0 10px}
nav{display:flex;gap:6px;padding:10px 16px;overflow-x:auto}nav button{flex:none}
button,select,input{font:inherit;color:var(--t);background:var(--p);border:1px solid var(--l);border-radius:6px;padding:8px 10px}
button{cursor:pointer}button.on,button.pri{background:var(--a);color:#10161c;border-color:var(--a);font-weight:600}button:hover{filter:brightness(1.1)}
main{max-width:1100px;margin:auto;padding:0 16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.card{background:var(--p);border:1px solid var(--l);border-radius:10px;padding:16px}
label{display:block;margin-bottom:10px}label>span{display:block;font-size:13px;color:var(--m)}label>div{display:flex;align-items:center;gap:6px}label input,label select{flex:1;min-width:0;width:100%}label b{font:12px ui-monospace,monospace;color:var(--m);min-width:34px}label i{font-size:12px;color:var(--m);display:block}
.res{font-variant-numeric:tabular-nums}.big{font:700 26px ui-monospace,monospace;color:var(--a)}.row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--l);padding:4px 0}
.warn{border-left:3px solid var(--r);padding:6px 10px;margin:8px 0;background:rgba(239,100,97,.1)}.note{border-left:3px solid var(--a);padding:6px 10px;margin:8px 0;font-size:13px;color:var(--m)}
.bar{display:flex;height:22px;border-radius:5px;overflow:hidden;margin:8px 0}.bar div{display:flex;align-items:center;justify-content:center;font-size:12px;color:#10161c}
.steps{font:12px ui-monospace,monospace;color:var(--m);margin:8px 0;padding-left:18px}.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid var(--l);padding:4px;text-align:left}.hide{display:none!important}
details{margin:8px 0}summary{cursor:pointer;color:var(--a)}.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin:8px 0 20px}.dash .card{cursor:pointer}
</style></head><body>
<header><h1>🎣 LURE LAB <small id="ver" style="color:var(--m)"></small></h1>
<button id="inst" class="hide">⬇ Install app</button><button id="upd">⟳ Check for update</button></header>
<nav id="nav"></nav><main id="main"></main><div class="note" style="max-width:1100px;margin:20px auto;padding:10px 16px">Hobby tool. Predictions are estimates; test every lure in water. Resin maker's instructions and safety guidance take precedence. Encapsulate lead and avoid dust or fumes.</div>
<script src="calc.js"></script><script src="app.js"></script></body></html>
